<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Aura: the sun climbs a dashed sky arc above the word Aura">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1630"/>
      <stop offset="0.62" stop-color="#070a14"/>
      <stop offset="1" stop-color="#030407"/>
    </linearGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffb067" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ff8a3d" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="490" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa65c"/>
      <stop offset="1" stop-color="#fff0c8"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2b8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe2b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030407" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#030407" stop-opacity="0.8"/>
    </linearGradient>
    <path id="arc" d="M490 300 A150 150 0 0 1 790 300"/>
  </defs>

  <rect width="1280" height="520" fill="url(#sky)"/>
  <!-- the sky lifts toward first light as the sun climbs -->
  <rect width="1280" height="300" fill="#1a2a52" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.72;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- a few stars that fade as the light comes up -->
  <g fill="#fff">
    <circle cx="180" cy="90" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0;0.8" keyTimes="0;0.4;0.8;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="150" r="1"><animate attributeName="opacity" values="0.6;0.1;0;0.6" keyTimes="0;0.35;0.8;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="70" r="1.4"><animate attributeName="opacity" values="0.9;0.3;0;0.9" keyTimes="0;0.45;0.8;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="190" r="1"><animate attributeName="opacity" values="0.5;0.1;0;0.5" keyTimes="0;0.3;0.8;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="130" r="0.9"><animate attributeName="opacity" values="0.7;0.2;0;0.7" keyTimes="0;0.4;0.8;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="230" r="0.9"><animate attributeName="opacity" values="0.5;0.1;0;0.5" keyTimes="0;0.3;0.8;1" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- warm light travelling with the sun -->
  <circle r="300" fill="url(#warm)">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.72;1" calcMode="spline" keySplines="0.45 0 0.2 1;0 0 1 1"><mpath xlink:href="#arc"/></animateMotion>
  </circle>
  <rect x="0" y="300" width="1280" height="220" fill="url(#ground)"/>

  <rect x="330" y="300" width="620" height="1.4" fill="url(#horizon)"/>
  <use xlink:href="#arc" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3.5 6"/>
  <path d="M490 300 A150 150 0 0 1 790 300" fill="none" stroke="url(#lit)" stroke-width="3.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.72;1" calcMode="spline" keySplines="0.45 0 0.2 1;0 0 1 1" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- the sun, its halo, and its glimmer on the water -->
  <g>
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.72;1" calcMode="spline" keySplines="0.45 0 0.2 1;0 0 1 1"><mpath xlink:href="#arc"/></animateMotion>
    <circle r="34" fill="url(#halo)"><animate attributeName="r" values="30;38;30" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle r="9" fill="#fff4d6"/>
  </g>

  <text x="640" y="398" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#fff">Aura</text>
  <text x="640" y="446" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#fff" opacity="0.62">A FAST, GLASS-CLEAR HOME SCREEN FOR ANDROID TV</text>

  <!-- a soft fade between loops -->
  <rect width="1280" height="520" fill="#030407" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.9;0.97;1" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
